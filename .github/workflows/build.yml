name: Build & Release

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: wiikit-windows-amd64.exe
            binary: build/bin/wiikit.exe
          - os: macos-latest
            platform: darwin/amd64
            artifact: wiikit-macos-amd64
            binary: build/bin/wiikit
          - os: macos-latest
            platform: darwin/arm64
            artifact: wiikit-macos-arm64
            binary: build/bin/wiikit
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: wiikit-linux-amd64
            binary: build/bin/wiikit

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
