name: Build & Release

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: wiikit-windows-amd64.exe
            binary: build/bin/wiikit-windows-amd64.exe
          - os: macos-latest
            platform: darwin/amd64
            artifact: wiikit-macos-amd64
            binary: build/bin/wiikit-macos-amd64.app
          - os: macos-latest
            platform: darwin/arm64
            artifact: wiikit-macos-arm64
            binary: build/bin/wiikit-macos-arm64.app
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: wiikit-linux-amd64
            binary: build/bin/wiikit-linux-amd64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          # Wails v2 hardcodes webkit2gtk-4.0 in pkg-config; create alias for Ubuntu 26.04+
          if ! pkg-config --exists webkit2gtk-4.0 && pkg-config --exists webkit2gtk-4.1; then
            sudo install -d /usr/local/lib/pkgconfig
            VER=$(pkg-config --modversion webkit2gtk-4.1)
            printf 'Name: webkit2gtk-4.0\nDescription: webkit2gtk-4.1 alias for Wails v2\nVersion: %s\nRequires: webkit2gtk-4.1\nCflags:\nLibs:\n' "$VER" | sudo tee /usr/local/lib/pkgconfig/webkit2gtk-4.0.pc
          fi

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - name: Rename macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # wails ignores -o for the .app bundle dir; rename it to match the artifact
          if [ -d "build/bin/wiikit.app" ]; then
            mv "build/bin/wiikit.app" "build/bin/${{ matrix.artifact }}.app"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
